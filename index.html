<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดการเงินเดือน - พระยาสัจจา V7.0 (Supabase Cloud)</title>
    
    <!-- นำเข้า Supabase Library -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap');

        :root { 
            --primary: #4f46e5; 
            --primary-hover: #4338ca;
            --success: #10b981; 
            --success-hover: #059669;
            --danger: #ef4444; 
            --bg: #f4f7f9; 
            --text-main: #1e293b;
            --text-muted: #64748b;
        }
        
        body { 
            font-family: 'Kanit', sans-serif; 
            margin: 0; 
            padding: 20px; 
            color: var(--text-main);
            background-color: var(--bg);
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 24px 24px;
        }
        
        .container { max-width: 1100px; margin: auto; }
        
        .nav-bar { 
            display: flex; gap: 12px; margin-bottom: 30px; padding: 15px; 
            background: rgba(255, 255, 255, 0.85); 
            backdrop-filter: blur(12px);
            border-radius: 16px; 
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 4px 20px -2px rgba(0,0,0,0.05); 
            position: sticky; top: 20px; z-index: 100;
        }
        
        .btn { 
            padding: 10px 22px; border-radius: 10px; border: none; cursor: pointer; 
            font-weight: 500; font-family: 'Kanit', sans-serif; transition: all 0.3s ease; 
            display: flex; align-items: center; gap: 8px; font-size: 0.95em; justify-content: center;
        }
        .btn-main { background: var(--primary); color: white; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25); }
        .btn-main:hover:not(:disabled) { background: var(--primary-hover); transform: translateY(-2px); }
        .btn-upload { background: linear-gradient(135deg, #8b5cf6, #7c3aed); color: white; }
        .btn-pdf { background: linear-gradient(135deg, #334155, #1e293b); color: white; }
        .btn-danger { background: #fee2e2; color: #ef4444; border: 1px solid #fca5a5; }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .emp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 24px; }
        
        .card { 
            background: white; border-radius: 20px; padding: 25px; 
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); 
            position: relative; transition: all 0.4s; 
            border: 1px solid rgba(226, 232, 240, 0.8);
        }
        .card.clickable:hover { 
            border-color: var(--primary); 
            transform: translateY(-5px);
            cursor: pointer;
        }
        
        .profile-img { 
            width: 85px; height: 85px; border-radius: 50%; background: #f1f5f9; 
            margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; 
            font-size: 40px; border: 4px solid white; box-shadow: 0 4px 10px rgba(0,0,0,0.08); 
            object-fit: cover;
        }
        
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 25px; }
        .stat-box { padding: 20px; border-radius: 16px; color: white; position: relative; overflow: hidden; }
        .bg-blue { background: linear-gradient(135deg, #4f46e5, #3730a3); }
        .bg-green { background: linear-gradient(135deg, #10b981, #059669); }
        .bg-dark { background: linear-gradient(135deg, #1e293b, #0f172a); }
        
        .input-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 18px; margin-top: 15px; }
        label { font-size: 0.85em; font-weight: 500; color: var(--text-muted); display: block; margin-bottom: 6px; }
        
        input, select { 
            width: 100%; padding: 12px 15px; border: 1px solid #cbd5e1; border-radius: 10px; 
            box-sizing: border-box; background: #f8fafc; font-family: 'Kanit', sans-serif;
        }
        
        table { width: 100%; border-collapse: separate; border-spacing: 0; background: white; border-radius: 12px; margin-top: 15px; min-width: 600px; }
        th { background: #f1f5f9; padding: 15px; text-align: center; color: var(--text-muted); font-size: 0.85em; border-bottom: 2px solid #e2e8f0; }
        td { padding: 15px; border-bottom: 1px solid #f1f5f9; text-align: center; font-size: 0.95em; }
        
        .hidden { display: none !important; }
        .bank-tag { background: #eff6ff; padding: 15px; border-radius: 12px; border-left: 5px solid #3b82f6; margin-bottom: 20px; }

        @media (max-width: 768px) {
            .nav-bar { flex-direction: column; }
            .stats-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- หน้า Login -->
    <div id="page-login" class="card" style="max-width: 400px; margin: 10vh auto; text-align: center;">
        <div style="font-size: 50px; margin-bottom: 10px;">🔐</div>
        <h2 style="color:var(--primary);">เข้าสู่ระบบจัดการเงินเดือน</h2>
        <p style="color:var(--text-muted); font-size:0.9em; margin-bottom:20px;">กรอกอีเมลเพื่อเข้าดูข้อมูล</p>
        <input type="text" id="login-email" placeholder="email@example.com" style="margin-bottom: 20px; text-align:center;">
        <button class="btn btn-main" style="width: 100%;" onclick="doLogin()">🚀 เข้าสู่ระบบ</button>
    </div>

    <!-- เมนูหลัก -->
    <div class="nav-bar hidden" id="main-nav">
        <button class="btn btn-main" id="nav-home" onclick="showPage('main')">🏠 หน้าแรก</button>
        <button class="btn btn-upload" id="nav-upload" onclick="showPage('upload')">📂 อัพโหลดไฟล์</button>
        <button class="btn btn-pdf" id="nav-pdf" onclick="exportPDF()">📄 ดาวน์โหลด PDF</button>
        <button class="btn btn-danger" style="margin-left:auto;" onclick="doLogout()">🚪 ออกจากระบบ</button>
    </div>

    <!-- หน้า Dashboard -->
    <div id="page-main" class="hidden">
        <div style="display:flex; justify-content:space-between; margin-bottom:20px;">
            <h2 style="margin:0;">Dashboard พนักงาน</h2>
            <button class="btn btn-main" style="background:#1e293b;" onclick="openAddEmployeeForm()">+ เพิ่มพนักงาน</button>
        </div>
        <div class="emp-grid" id="list-grid"></div>
    </div>

    <!-- หน้าอัพโหลด Excel -->
    <div id="page-upload" class="hidden card">
        <h3 style="text-align:center;">อัพโหลดไฟล์ Excel (แยกตามรอบ)</h3>
        <div class="input-row">
            <div class="upload-zone">
                <h4 style="color:var(--primary);">รอบต้นเดือน (1-15)</h4>
                <select id="sel-branch-1" style="margin-bottom:10px;">
                    <option value="เมืองชลบุรี">เมืองชลบุรี</option>
                    <option value="ดอนหัวฬ่อ">ดอนหัวฬ่อ</option>
                    <option value="ทองหลาง">ทองหลาง</option>
                </select>
                <input type="file" id="file-1" accept=".xlsx,.xls" style="margin-bottom:10px;">
                <button class="btn btn-main" style="width:100%;" onclick="handleFileUpload(1)">⚡ ประมวลผลรอบต้นเดือน</button>
            </div>
            <div class="upload-zone">
                <h4 style="color:var(--success);">รอบปลายเดือน (16-31)</h4>
                <select id="sel-branch-2" style="margin-bottom:10px;">
                    <option value="เมืองชลบุรี">เมืองชลบุรี</option>
                    <option value="ดอนหัวฬ่อ">ดอนหัวฬ่อ</option>
                    <option value="ทองหลาง">ทองหลาง</option>
                </select>
                <input type="file" id="file-2" accept=".xlsx,.xls" style="margin-bottom:10px;">
                <button class="btn btn-main" style="background:var(--success); width:100%;" onclick="handleFileUpload(2)">⚡ ประมวลผลรอบปลายเดือน</button>
            </div>
        </div>
    </div>

    <!-- หน้าฟอร์มพนักงาน -->
    <div id="page-form" class="hidden card">
        <h3 id="form-title">ลงทะเบียนพนักงาน</h3>
        <div class="input-row">
            <div style="grid-column: 1 / -1;">
                <label>รูปถ่ายพนักงาน</label>
                <input type="file" accept="image/*" onchange="previewImage(this)">
                <img id="img-preview" class="profile-img" style="margin:15px 0; display:none;">
            </div>
            <div><label>ชื่อเรียก (ในไฟล์)</label><input type="text" id="in-name"></div>
            <div><label>ชื่อจริง</label><input type="text" id="in-fullname"></div>
            <div><label>อีเมลล็อกอิน</label><input type="text" id="in-email"></div>
            <div>
                <label>สาขา</label>
                <select id="in-branch">
                    <option value="เมืองชลบุรี">เมืองชลบุรี</option>
                    <option value="ดอนหัวฬ่อ">ดอนหัวฬ่อ</option>
                    <option value="ทองหลาง">ทองหลาง</option>
                </select>
            </div>
            <div>
                <label>ประเภท</label>
                <select id="in-role">
                    <option value="FT">Full-Time</option>
                    <option value="PT">Part-Time</option>
                </select>
            </div>
            <div><label>ธนาคาร</label><input type="text" id="in-bank-name"></div>
            <div><label>เลขบัญชี</label><input type="text" id="in-bank-no"></div>
            <div><label>ค่าแรง</label><input type="number" id="in-wage"></div>
            <div><label>เรท OT</label><input type="number" id="in-ot" value="50"></div>
        </div>
        <div style="margin-top:20px; display:flex; gap:10px;">
            <button class="btn btn-main" id="btn-save" onclick="saveEmployee()">💾 บันทึก</button>
            <button class="btn" onclick="showPage('main')">ยกเลิก</button>
        </div>
    </div>

    <!-- หน้าโปรไฟล์เงินเดือน -->
    <div id="page-profile" class="hidden">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
            <div style="display:flex; align-items:center; gap:15px;">
                <div id="view-photo-container"></div>
                <div>
                    <h2 id="view-name" style="margin:0;"></h2>
                    <span id="view-branch-badge" style="font-size:0.8em; background:#ddd; padding:2px 8px; border-radius:10px;"></span>
                </div>
            </div>
            <button class="btn btn-main" onclick="showPage('main')" id="btn-back">⬅️ กลับ</button>
        </div>

        <div class="bank-tag">🏦 บัญชี: <span id="view-bank-info"></span></div>

        <div class="stats-grid">
            <div class="stat-box bg-blue"><small>รายได้ปกติ</small><div id="res-wage" style="font-size:1.8em;">0</div></div>
            <div class="stat-box bg-green"><small>รายได้ OT</small><div id="res-ot" style="font-size:1.8em;">0</div></div>
            <div class="stat-box bg-dark"><small>ยอดสุทธิ</small><div id="res-net" style="font-size:1.8em; color:#4ade80;">0</div></div>
        </div>

        <div class="card" style="margin-bottom:20px;">
            <h4>📝 รายการเพิ่มเติม (Admin)</h4>
            <div class="input-row">
                <div><label>โบนัส</label><input type="number" id="adj-bonus" onchange="updateCalc(true)"></div>
                <div><label>เบิก 1</label><input type="number" id="adj-withdraw" onchange="updateCalc(true)"></div>
                <div><label>เบิก 2</label><input type="number" id="adj-withdraw2" onchange="updateCalc(true)"></div>
                <div><label>หักอื่นๆ</label><input type="number" id="adj-other" onchange="updateCalc(true)"></div>
                <div><label>ประกันสังคม</label><input type="number" id="adj-social" onchange="updateCalc(true)"></div>
            </div>
        </div>

        <div class="card table-responsive" style="padding:0;">
            <table>
                <thead><tr><th>วันที่</th><th>เวลา</th><th>ชม.</th><th>OT</th><th>สาย</th></tr></thead>
                <tbody id="log-table-body"></tbody>
            </table>
        </div>
        <button class="btn btn-danger" style="margin-top:20px;" onclick="deleteEmployee()" id="btn-del">🗑️ ลบพนักงาน</button>
    </div>
</div>

<script>
    // ตั้งค่า Supabase
    const SUPABASE_URL = 'https://kqwajgklgokhwvwjuicw.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtxd2FqZ2tsZ29raHd2d2p1aWN3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc2NTQ1NDAsImV4cCI6MjA5MzIzMDU0MH0.6Ye_tTze_Q8VmPAzemtm6wpaalFGNRiZtY7gI2hBScA';
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let employees = [];
    let curId = null;
    let editingId = null;
    let tempPhoto = "";
    let userRole = null;

    async function doLogin() {
        const input = document.getElementById('login-email').value.trim();
        const btn = document.querySelector('#page-login .btn-main');
        btn.disabled = true; btn.innerText = "กำลังเชื่อมต่อ...";

        try {
            const { data, error } = await supabase.from('employees').select('*');
            if(error) throw error;
            employees = data;

            if(input === 'Admin8123') {
                userRole = 'admin';
                document.getElementById('main-nav').classList.remove('hidden');
                showPage('main');
            } else {
                const emp = employees.find(e => e.email && e.email.toLowerCase() === input.toLowerCase());
                if(emp) {
                    userRole = 'employee';
                    document.getElementById('main-nav').classList.remove('hidden');
                    document.getElementById('nav-home').classList.add('hidden');
                    document.getElementById('nav-upload').classList.add('hidden');
                    openProfile(emp.id);
                } else {
                    alert("ไม่พบข้อมูลผู้ใช้");
                }
            }
        } catch (e) { alert("Error: " + e.message); }
        finally { btn.disabled = false; btn.innerText = "🚀 เข้าสู่ระบบ"; }
    }

    function doLogout() {
        userRole = null; curId = null;
        document.getElementById('main-nav').classList.add('hidden');
        showPage('login');
    }

    function showPage(p) {
        ['login','main','upload','form','profile'].forEach(pg => document.getElementById('page-'+pg).classList.add('hidden'));
        document.getElementById('page-'+p).classList.remove('hidden');
        if(p === 'main') renderList();
    }

    function renderList() {
        const g = document.getElementById('list-grid'); g.innerHTML = '';
        employees.forEach(e => {
            const d = document.createElement('div'); d.className = 'card clickable';
            d.onclick = () => openProfile(e.id);
            const img = e.photo ? `<img src="${e.photo}" class="profile-img">` : `<div class="profile-img">👤</div>`;
            d.innerHTML = `${img}<div style="text-align:center;"><strong>${e.name}</strong><br><small>${e.branch}</small></div>`;
            g.appendChild(d);
        });
    }

    function previewImage(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = (e) => { 
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = 200; canvas.height = 200;
                    canvas.getContext('2d').drawImage(img, 0,0,200,200);
                    tempPhoto = canvas.toDataURL('image/jpeg', 0.6);
                    document.getElementById('img-preview').src = tempPhoto;
                    document.getElementById('img-preview').style.display = 'block';
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(input.files[0]);
        }
    }

    function openAddEmployeeForm() {
        editingId = null; tempPhoto = "";
        document.getElementById('page-form').querySelectorAll('input').forEach(i => i.value = '');
        document.getElementById('img-preview').style.display = 'none';
        showPage('form');
    }

    async function saveEmployee() {
        const btn = document.getElementById('btn-save');
        btn.disabled = true; btn.innerText = "⏳ บันทึก...";

        const payload = {
            id: editingId || 'id_'+Date.now(),
            name: document.getElementById('in-name').value,
            fullname: document.getElementById('in-fullname').value,
            email: document.getElementById('in-email').value,
            branch: document.getElementById('in-branch').value,
            role: document.getElementById('in-role').value,
            bankName: document.getElementById('in-bank-name').value,
            bankNo: document.getElementById('in-bank-no').value,
            wage: parseFloat(document.getElementById('in-wage').value) || 0,
            otRate: parseFloat(document.getElementById('in-ot').value) || 50,
            photo: tempPhoto,
            logs: editingId ? (employees.find(x=>x.id===editingId).logs || {}) : {}
        };

        const { error } = await supabase.from('employees').upsert(payload);
        if(!error) {
            const { data } = await supabase.from('employees').select('*');
            employees = data; showPage('main');
        } else { alert("Error: " + error.message); }
        btn.disabled = false; btn.innerText = "💾 บันทึก";
    }

    async function openProfile(id) {
        curId = id; const e = employees.find(x => x.id === id);
        const isAdmin = (userRole === 'admin');

        document.getElementById('btn-del').style.display = isAdmin ? 'block' : 'none';
        document.querySelectorAll('#page-profile input').forEach(i => i.disabled = !isAdmin);

        document.getElementById('view-name').innerText = e.name;
        document.getElementById('view-branch-badge').innerText = e.branch;
        document.getElementById('view-bank-info').innerText = `${e.bankName} - ${e.bankNo}`;
        document.getElementById('view-photo-container').innerHTML = e.photo ? `<img src="${e.photo}" class="profile-img">` : `<div class="profile-img">👤</div>`;

        ['bonus','withdraw','withdraw2','other','social'].forEach(f => document.getElementById('adj-'+f).value = e[f] || 0);

        updateCalc(false);
        showPage('profile');
    }

    function updateCalc(shouldSave) {
        const e = employees.find(x => x.id === curId);
        if(userRole === 'admin') {
            ['bonus','withdraw','withdraw2','other','social'].forEach(f => e[f] = parseFloat(document.getElementById('adj-'+f).value) || 0);
        }

        let totalWage = 0, totalOT = 0;
        const tbody = document.getElementById('log-table-body'); tbody.innerHTML = '';
        
        Object.keys(e.logs || {}).forEach(day => {
            const l = e.logs[day];
            totalWage += (e.role === 'FT' ? e.wage : (e.wage/9)*l.workHrs);
            totalOT += (l.ot * e.otRate);
            tbody.innerHTML += `<tr><td>${day}</td><td>${l.time}</td><td>${l.workHrs}</td><td>${l.ot}</td><td>${l.lateMins}</td></tr>`;
        });

        const net = (totalWage + totalOT + e.bonus) - (e.withdraw + e.withdraw2 + e.other + e.social);
        document.getElementById('res-wage').innerText = Math.round(totalWage).toLocaleString();
        document.getElementById('res-ot').innerText = Math.round(totalOT).toLocaleString();
        document.getElementById('res-net').innerText = Math.round(net).toLocaleString();

        if(shouldSave && userRole === 'admin') {
            supabase.from('employees').upsert(e).then();
        }
    }

    async function handleFileUpload(p) {
        const file = document.getElementById('file-'+p).files[0];
        if(!file) return alert("กรุณาเลือกไฟล์");

        const reader = new FileReader();
        reader.onload = async (ev) => {
            const wb = XLSX.read(new Uint8Array(ev.target.result), {type:'array'});
            // ... กระบวนการอ่านไฟล์ Excel จะต้องสอดคล้องกับโครงสร้างพนักงานใน Supabase ...
            alert("อัพโหลดสำเร็จ (จำลอง)"); 
            showPage('main');
        };
        reader.readAsArrayBuffer(file);
    }

    async function deleteEmployee() {
        if(confirm("ยืนยันการลบ?")) {
            await supabase.from('employees').delete().eq('id', curId);
            const { data } = await supabase.from('employees').select('*');
            employees = data; showPage('main');
        }
    }

    function exportPDF() { alert("กำลังเตรียม PDF..."); }
    function toM(s) { if(!s) return 0; const p = s.split(':'); return (parseInt(p[0])*60)+(parseInt(p[1])||0); }
</script>
</body>
</html>
